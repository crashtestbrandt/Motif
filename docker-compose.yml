# Local development services for motif.
# Bring up: `docker compose up -d`
# Tear down: `docker compose down`         (data persists in named volume)
# Wipe data: `docker compose down -v`      (drops the named volume)

services:
  neo4j:
    image: neo4j:5-community
    container_name: motif_neo4j
    ports:
      - "7474:7474" # Neo4j Browser (HTTP)
      - "7687:7687" # Bolt protocol (boltx connects here)
    environment:
      # Dev credentials only — overridden by env in runtime.exs.
      NEO4J_AUTH: "neo4j/motifdev"
      # Accept the Community Edition license terms automatically.
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      # Modest dev heap; bump if a game's graph gets large.
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "1G"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      # cypher-shell ships in the Neo4j image; trivial round-trip = healthy.
      test:
        - CMD-SHELL
        - "cypher-shell -u neo4j -p motifdev 'RETURN 1' >/dev/null 2>&1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
